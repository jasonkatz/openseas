name: Set up a Vercel build
description: pnpm, Node 22 with the pnpm cache, and the Vercel CLI. Run after actions/checkout.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - run: npm install -g vercel
      shell: bash
