name: Preview

# Every pull request that touches code gets its own full stack (ADR 0017):
#
#   1. A Railway environment named pr-<number>, duplicated from production the first time, so it
#      has its own server service and its own fresh, empty Postgres. The PR's commit is uploaded
#      into it with `railway up` and the job waits until /health reports that commit.
#   2. The game client and the puzzle harness (ADR 0019), each built in CI against that server
#      (VITE_SERVER_URL) and deployed to its own production Vercel project as a preview (ADR 0016),
#      under a stable alias per PR so the server can list both origins in CLIENT_ORIGINS before
#      anything deploys.
#
# One PR comment carries the URLs. preview-cleanup.yml tears everything down when the PR closes.
# Neither host is connected to the repository. Setup and secrets: docs/DEPLOY.md, "Previews".
#
# Without the Railway secrets (a fork PR, or before they are set up) the server job skips with a
# warning and the previews talk to the production server, as they did before ADR 0017. Without
# VERCEL_HARNESS_PROJECT_ID the harness preview skips with a warning and the game still previews.
#
# It can also be run by hand for a pull request number, for a PR whose last push did not start it
# (one opened before this workflow existed, say). From the default branch's Actions tab.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to build a preview for
        type: number
        required: true
  pull_request:
    paths:
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - railpack.json
      - vercel.json
      - .github/workflows/preview.yml
      - .github/scripts/**

concurrency:
  group: preview-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  pr:
    name: Which pull request
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pr.outputs.number }}
      sha: ${{ steps.pr.outputs.sha }}
      ref: ${{ steps.pr.outputs.ref }}
      environment: pr-${{ steps.pr.outputs.number }}
      client_host: ${{ vars.PREVIEW_ALIAS_PREFIX || 'openseas-pr' }}-${{ steps.pr.outputs.number }}.vercel.app
      harness_host: ${{ vars.PREVIEW_HARNESS_ALIAS_PREFIX || 'openseas-harness-pr' }}-${{ steps.pr.outputs.number }}.vercel.app
    steps:
      - id: pr
        # From the event when a pull request started this run; looked up by number when run by hand.
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let pr = context.payload.pull_request;
            if (!pr) {
              const number = Number(context.payload.inputs.pr);
              if (!Number.isInteger(number) || number <= 0) core.setFailed(`not a pull request number: ${context.payload.inputs.pr}`);
              pr = (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;
            }
            core.setOutput("number", String(pr.number));
            core.setOutput("sha", pr.head.sha);
            core.setOutput("ref", pr.head.ref);
            core.info(`pull request #${pr.number}: ${pr.head.ref} at ${pr.head.sha}`);

  server:
    name: Server and database on Railway
    needs: pr
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      url: ${{ steps.domain.outputs.url }}
    env:
      # A workspace (or account) token, not a project token: project tokens are scoped to one
      # environment and cannot create or deploy to others.
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      # The CLI reads RAILWAY_PROJECT_ID itself, so no `railway link` (which needs a user, not a
      # workspace token). Every command names its environment and service explicitly.
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE || 'server' }}
      RAILWAY_DATABASE_SERVICE: ${{ vars.RAILWAY_DATABASE_SERVICE || 'Postgres' }}
      SOURCE_ENVIRONMENT: production
      ENVIRONMENT: ${{ needs.pr.outputs.environment }}
      SHA: ${{ needs.pr.outputs.sha }}
      # Both front ends' stable aliases: the server allows each before either deploys.
      CLIENT_ORIGINS: https://${{ needs.pr.outputs.client_host }},https://${{ needs.pr.outputs.harness_host }}
    steps:
      - name: Check configuration
        id: config
        # Pull requests from forks get no secrets. Skip quietly instead of failing their checks.
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ] || [ -z "$RAILWAY_PROJECT_ID" ]; then
            echo "::warning::RAILWAY_API_TOKEN or RAILWAY_PROJECT_ID is not available to this run, so no server preview is deployed; the previews will talk to the production server. They must be repository-scoped. See docs/DEPLOY.md, \"Previews\"."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
        with:
          ref: ${{ needs.pr.outputs.sha }}
      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
      - if: steps.config.outputs.ready == 'true'
        run: npm install -g @railway/cli
      - name: Create the environment if it does not exist
        id: create
        if: steps.config.outputs.ready == 'true'
        # Duplicating production copies its services, variables (the references to the Postgres
        # service's DATABASE_URL and to RAILWAY_PUBLIC_DOMAIN resolve inside the new environment)
        # and settings, and creates fresh volumes, so the database starts empty.
        # The server service has no source to deploy until `railway up` below. A new environment
        # gets its own auth secret rather than production's.
        run: |
          existing="$(railway environment list --json | jq -r --arg name "$ENVIRONMENT" '.environments[] | select(.name == $name) | .id')"
          if [ -n "$existing" ]; then
            echo "environment $ENVIRONMENT exists ($existing)"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          railway environment new "$ENVIRONMENT" --duplicate "$SOURCE_ENVIRONMENT" --json
          secret="$(openssl rand -base64 48)"
          echo "::add-mask::$secret"
          railway variables --environment "$ENVIRONMENT" --service "$RAILWAY_SERVICE" --skip-deploys \
            --set "BETTER_AUTH_SECRET=$secret"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Created Railway environment $ENVIRONMENT from $SOURCE_ENVIRONMENT" >> "$GITHUB_STEP_SUMMARY"
      - name: Wait for the database
        if: steps.config.outputs.ready == 'true'
        # The server runs migrations on boot and gives up after a few crashes, so do not upload it
        # until Postgres has a successful deployment. A duplicated database comes up in a minute.
        run: |
          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            status="$(railway deployment list --environment "$ENVIRONMENT" --service "$RAILWAY_DATABASE_SERVICE" --limit 1 --json | jq -r '.[0].status // "NONE"')"
            case "$status" in
              SUCCESS) echo "$RAILWAY_DATABASE_SERVICE is up"; exit 0 ;;
              FAILED|CRASHED) echo "::error::$RAILWAY_DATABASE_SERVICE deployment in $ENVIRONMENT is $status. Check it in the Railway dashboard."; exit 1 ;;
              *) echo "$RAILWAY_DATABASE_SERVICE: $status"; sleep 10 ;;
            esac
          done
          echo "::error::$RAILWAY_DATABASE_SERVICE in $ENVIRONMENT did not come up within 10 minutes."
          exit 1
      - name: Public domain for the server
        id: domain
        if: steps.config.outputs.ready == 'true'
        # Generates a Railway domain the first time; prints the existing one after that.
        run: |
          out="$(railway domain --environment "$ENVIRONMENT" --service "$RAILWAY_SERVICE" --json)"
          host="$(printf '%s' "$out" | jq -r '.domain // .domains[0] // empty' | sed -e 's#^https\?://##' -e 's#/$##')"
          if [ -z "$host" ]; then
            echo "::error::Could not get a domain for $RAILWAY_SERVICE in $ENVIRONMENT. railway domain said: $out"
            exit 1
          fi
          echo "url=https://$host" >> "$GITHUB_OUTPUT"
          echo "server: https://$host"
      - name: Point the server at the previews and record the commit
        if: steps.config.outputs.ready == 'true'
        run: |
          railway variables --environment "$ENVIRONMENT" --service "$RAILWAY_SERVICE" --skip-deploys \
            --set "CLIENT_ORIGINS=$CLIENT_ORIGINS" \
            --set "GIT_COMMIT_SHA=$SHA"
      - name: Upload and build
        if: steps.config.outputs.ready == 'true'
        run: |
          railway up --environment "$ENVIRONMENT" --service "$RAILWAY_SERVICE" --ci
          echo "Server preview uploaded to Railway environment $ENVIRONMENT (commit $SHA)" >> "$GITHUB_STEP_SUMMARY"
      - name: Wait until the server serves this commit
        if: steps.config.outputs.ready == 'true'
        env:
          URL: ${{ steps.domain.outputs.url }}
        run: .github/scripts/wait-for-commit.sh "$URL/health" "$SHA" 900

  client:
    name: Client preview on Vercel
    needs: [pr, server]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.alias.outputs.url }}
    env:
      APP: client
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      SERVER_URL: ${{ needs.server.outputs.url }}
      HOST: ${{ needs.pr.outputs.client_host }}
      SHA: ${{ needs.pr.outputs.sha }}
      BRANCH: ${{ needs.pr.outputs.ref }}
      PR: ${{ needs.pr.outputs.number }}
    steps:
      - name: Check configuration
        id: config
        # Pull requests from forks get no secrets. Skip quietly instead of failing their checks.
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_PROJECT_ID is not available to this run, so no client preview is deployed. They must be repository-scoped, not only on the production environment. See docs/DEPLOY.md, \"Previews\"."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
        with:
          ref: ${{ needs.pr.outputs.sha }}
      - uses: pnpm/action-setup@v4
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.config.outputs.ready == 'true'
        run: npm install -g vercel
      - name: Build and deploy the preview
        if: steps.config.outputs.ready == 'true'
        id: deploy
        timeout-minutes: 10
        run: .github/scripts/vercel-preview.sh
      - name: Stable address for this PR
        if: steps.config.outputs.ready == 'true'
        id: alias
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: .github/scripts/vercel-alias.sh

  harness:
    name: Harness preview on Vercel
    needs: [pr, server]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.alias.outputs.url }}
    env:
      APP: harness
      # A token that can see the harness project: VERCEL_HARNESS_TOKEN if set (a token scoped to
      # the harness project), else VERCEL_TOKEN (which must then be scoped to the team, not to the
      # game's project; a project-scoped token reports the other project as "not found").
      VERCEL_TOKEN: ${{ secrets.VERCEL_HARNESS_TOKEN || secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      # The harness's own Vercel project, rooted in packages/harness (docs/DEPLOY.md, step 2b).
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_HARNESS_PROJECT_ID }}
      SERVER_URL: ${{ needs.server.outputs.url }}
      HOST: ${{ needs.pr.outputs.harness_host }}
      SHA: ${{ needs.pr.outputs.sha }}
      BRANCH: ${{ needs.pr.outputs.ref }}
      PR: ${{ needs.pr.outputs.number }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ]; then
            echo "::warning::VERCEL_TOKEN or VERCEL_ORG_ID is not available to this run, so no harness preview is deployed. See docs/DEPLOY.md, \"Previews\"."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Variable VERCEL_HARNESS_PROJECT_ID is not set, so no harness preview is deployed. Create the harness project and set it to get one. See docs/DEPLOY.md, step 2b."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
        with:
          ref: ${{ needs.pr.outputs.sha }}
      - uses: pnpm/action-setup@v4
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.config.outputs.ready == 'true'
        run: npm install -g vercel
      - name: Build and deploy the preview
        if: steps.config.outputs.ready == 'true'
        id: deploy
        timeout-minutes: 10
        run: .github/scripts/vercel-preview.sh
      - name: Stable address for this PR
        if: steps.config.outputs.ready == 'true'
        id: alias
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: .github/scripts/vercel-alias.sh

  comment:
    name: Comment the URLs on the pull request
    needs: [pr, server, client, harness]
    if: always() && needs.pr.result == 'success' && (needs.client.outputs.url != '' || needs.harness.outputs.url != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          CLIENT_URL: ${{ needs.client.outputs.url }}
          HARNESS_URL: ${{ needs.harness.outputs.url }}
          SERVER_URL: ${{ needs.server.outputs.url }}
          SHA: ${{ needs.pr.outputs.sha }}
          ENVIRONMENT: ${{ needs.pr.outputs.environment }}
          PR: ${{ needs.pr.outputs.number }}
        with:
          script: |
            const marker = "<!-- openseas-preview -->";
            const { CLIENT_URL, HARNESS_URL, SERVER_URL, SHA, ENVIRONMENT, PR } = process.env;
            const server = SERVER_URL
              ? `[${SERVER_URL}](${SERVER_URL}/health) in Railway environment \`${ENVIRONMENT}\`, with its own empty database`
              : "the production server (no `RAILWAY_API_TOKEN` for this run), so anything that needs the server will fail from the previews";
            const body = [
              marker,
              `**Preview** for commit \`${SHA.slice(0, 7)}\``,
              "",
              `- Game: ${CLIENT_URL ? CLIENT_URL : "not deployed (see the client preview job)"}`,
              `- Harness: ${HARNESS_URL ? HARNESS_URL : "not deployed (set `VERCEL_HARNESS_PROJECT_ID`; see docs/DEPLOY.md step 2b)"}`,
              `- Server: ${server}`,
              "",
              SERVER_URL ? "Torn down when this pull request closes." : "",
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = Number(PR);
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user.type === "Bot" && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
