name: Deploy

# Continuous deployment from main (ADR 0014). Runs after CI succeeds on main, or by hand.
# Order is deliberate: the server goes first and must serve the new commit on /health before the
# two front ends are built and deployed against it. The game (client) and the puzzle harness
# (ADR 0019) are separate Vercel projects and deploy in parallel after the server. Each side is
# skipped when nothing under it changed, unless forced from the manual trigger. Setup and secrets:
# docs/DEPLOY.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      server:
        description: Deploy the server even if nothing under it changed
        type: boolean
        default: false
      client:
        description: Deploy the game client even if nothing under it changed
        type: boolean
        default: false
      harness:
        description: Deploy the puzzle harness even if nothing under it changed
        type: boolean
        default: false

# Deploys queue behind each other and never cancel one in flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  plan:
    name: What changed
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.changed.outputs.server }}
      client: ${{ steps.changed.outputs.client }}
      harness: ${{ steps.changed.outputs.harness }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 2
      - id: changed
        env:
          FORCE_SERVER: ${{ inputs.server == true }}
          FORCE_CLIENT: ${{ inputs.client == true }}
          FORCE_HARNESS: ${{ inputs.harness == true }}
        run: |
          server=false; client=false; harness=false
          shared="packages/engine packages/protocol packages/content pnpm-lock.yaml pnpm-workspace.yaml package.json .github/workflows/deploy.yml"
          if [ "$FORCE_SERVER" = true ] || ! git diff --quiet HEAD^ HEAD -- packages/server $shared railpack.json; then
            server=true
          fi
          if [ "$FORCE_CLIENT" = true ] || ! git diff --quiet HEAD^ HEAD -- packages/client packages/boards $shared vercel.json; then
            client=true
          fi
          if [ "$FORCE_HARNESS" = true ] || ! git diff --quiet HEAD^ HEAD -- packages/harness packages/boards $shared; then
            harness=true
          fi
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "client=$client" >> "$GITHUB_OUTPUT"
          echo "harness=$harness" >> "$GITHUB_OUTPUT"
          echo "commit $SHA: server=$server client=$client harness=$harness"

  server:
    name: Server to Railway
    needs: plan
    if: needs.plan.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      SERVER_URL: ${{ vars.PRODUCTION_SERVER_URL }}
      CLIENT_URL: ${{ vars.PRODUCTION_CLIENT_URL }}
      HARNESS_URL: ${{ vars.PRODUCTION_HARNESS_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @railway/cli
      - name: Check configuration
        run: |
          ok=true
          [ -n "$RAILWAY_TOKEN" ] || { echo "::error::Secret RAILWAY_TOKEN is not set. See docs/DEPLOY.md, step 1."; ok=false; }
          [ -n "$RAILWAY_SERVICE" ] || { echo "::error::Variable RAILWAY_SERVICE is not set. See docs/DEPLOY.md, step 1."; ok=false; }
          [ -n "$SERVER_URL" ] || echo "::warning::Variable PRODUCTION_SERVER_URL is not set, so this job cannot wait for the server to come up before the client deploys."
          $ok
      - name: Record the commit on the service
        run: railway variables --service "$RAILWAY_SERVICE" --set "GIT_COMMIT_SHA=$SHA" --skip-deploys
      - name: Upload and build
        run: |
          railway up --service "$RAILWAY_SERVICE" --ci
          echo "Server uploaded to Railway service $RAILWAY_SERVICE (commit $SHA)" >> "$GITHUB_STEP_SUMMARY"
      - name: Wait until the server serves this commit
        run: |
          if [ -z "$SERVER_URL" ]; then exit 0; fi
          .github/scripts/wait-for-commit.sh "$SERVER_URL/health" "$SHA" 900
      - name: Server accepts requests from the client origin
        # The browser preflights every API call. If CLIENT_ORIGINS on the Railway service does not
        # list the client's exact origin, the game is unusable even though both deploys are green.
        run: |
          if [ -z "$SERVER_URL" ] || [ -z "$CLIENT_URL" ]; then exit 0; fi
          .github/scripts/check-origin.sh "$SERVER_URL" "$CLIENT_URL" "the game client"
      - name: Server accepts requests from the harness origin
        # Same check for the harness; a warning only, so a missing origin never blocks the game.
        run: |
          if [ -z "$SERVER_URL" ] || [ -z "$HARNESS_URL" ]; then exit 0; fi
          .github/scripts/check-origin.sh "$SERVER_URL" "$HARNESS_URL" "the harness" || echo "::warning::The server does not allow the harness origin yet; the harness job repeats this check and fails if it is still missing."

  client:
    name: Client to Vercel
    needs: [plan, server]
    # always() so a skipped server deploy does not skip the client; a failed one does.
    if: always() && needs.plan.outputs.client == 'true' && (needs.server.result == 'success' || needs.server.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      CLIENT_URL: ${{ vars.PRODUCTION_CLIENT_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: npm install -g vercel
      - name: Check configuration
        run: |
          ok=true
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::Secret VERCEL_TOKEN is not set. See docs/DEPLOY.md, step 2."; ok=false; }
          [ -n "$VERCEL_ORG_ID" ] || { echo "::error::Variable VERCEL_ORG_ID is not set. See docs/DEPLOY.md, step 2."; ok=false; }
          [ -n "$VERCEL_PROJECT_ID" ] || { echo "::error::Variable VERCEL_PROJECT_ID is not set. See docs/DEPLOY.md, step 2."; ok=false; }
          $ok
      - name: Pull production settings and env
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
      - name: Build
        env:
          COMMIT_SHA: ${{ env.SHA }}
        run: vercel build --prod --token "$VERCEL_TOKEN"
      - name: Deploy
        run: |
          set -o pipefail
          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" \
            --meta githubCommitSha="$SHA" \
            --meta githubCommitRef=main \
            --meta githubCommitOrg="${GITHUB_REPOSITORY_OWNER}" \
            --meta githubCommitRepo="${GITHUB_REPOSITORY#*/}" \
            | tee deploy-url.txt
          echo "Client deployed: $(tail -n1 deploy-url.txt) (commit $SHA)" >> "$GITHUB_STEP_SUMMARY"
      - name: Wait until the client serves this commit
        run: |
          if [ -z "$CLIENT_URL" ]; then
            echo "::warning::Variable PRODUCTION_CLIENT_URL is not set; skipping the post-deploy check."
            exit 0
          fi
          .github/scripts/wait-for-commit.sh "$CLIENT_URL/version.json" "$SHA" 300

  harness:
    name: Harness to Vercel
    needs: [plan, server]
    if: always() && needs.plan.outputs.harness == 'true' && (needs.server.result == 'success' || needs.server.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      # A token that can see the harness project: VERCEL_HARNESS_TOKEN if set (a token scoped to
      # the harness project), else VERCEL_TOKEN (which must then be scoped to the team, not to the
      # game's project; a project-scoped token reports the other project as "not found").
      VERCEL_TOKEN: ${{ secrets.VERCEL_HARNESS_TOKEN || secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      # The harness is its own Vercel project, rooted in packages/harness (docs/DEPLOY.md, step 2b).
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_HARNESS_PROJECT_ID }}
      HARNESS_URL: ${{ vars.PRODUCTION_HARNESS_URL }}
      SERVER_URL: ${{ vars.PRODUCTION_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: npm install -g vercel
      - name: Check configuration
        run: |
          ok=true
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::Secret VERCEL_TOKEN is not set. See docs/DEPLOY.md, step 2."; ok=false; }
          [ -n "$VERCEL_ORG_ID" ] || { echo "::error::Variable VERCEL_ORG_ID is not set. See docs/DEPLOY.md, step 2."; ok=false; }
          [ -n "$VERCEL_PROJECT_ID" ] || { echo "::error::Variable VERCEL_HARNESS_PROJECT_ID is not set: the harness has no Vercel project to deploy to. See docs/DEPLOY.md, step 2b."; ok=false; }
          $ok
      - name: Pull production settings and env
        run: |
          set -o pipefail
          if ! vercel pull --yes --environment=production --token "$VERCEL_TOKEN" 2>&1 | tee pull.log; then
            grep -q "Project not found" pull.log && echo "::error::The Vercel token cannot see the harness project (prj id in VERCEL_HARNESS_PROJECT_ID). A token scoped to the game's project reports every other project as not found: add a secret VERCEL_HARNESS_TOKEN scoped to the harness project, or make VERCEL_TOKEN a team-scoped token. See docs/DEPLOY.md, step 2b.7."
            exit 1
          fi
      - name: Build
        env:
          COMMIT_SHA: ${{ env.SHA }}
        # The project's Root Directory is packages/harness, so the build runs there and reads
        # packages/harness/vercel.json; the output lands in .vercel/output at the repo root.
        run: |
          vercel build --prod --token "$VERCEL_TOKEN"
          test -d .vercel/output || { echo "::error::vercel build produced no .vercel/output; is the harness project's Root Directory packages/harness? See docs/DEPLOY.md, step 2b."; exit 1; }
      - name: Deploy
        run: |
          set -o pipefail
          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" \
            --meta githubCommitSha="$SHA" \
            --meta githubCommitRef=main \
            --meta githubCommitOrg="${GITHUB_REPOSITORY_OWNER}" \
            --meta githubCommitRepo="${GITHUB_REPOSITORY#*/}" \
            | tee deploy-url.txt
          echo "Harness deployed: $(tail -n1 deploy-url.txt) (commit $SHA)" >> "$GITHUB_STEP_SUMMARY"
      - name: Wait until the harness serves this commit
        run: |
          if [ -z "$HARNESS_URL" ]; then
            echo "::warning::Variable PRODUCTION_HARNESS_URL is not set; skipping the post-deploy checks."
            exit 0
          fi
          .github/scripts/wait-for-commit.sh "$HARNESS_URL/version.json" "$SHA" 300
      - name: Deep links open
        # Every puzzle page is a deep link; without the SPA rewrite from packages/harness/vercel.json
        # a shared scenario link would 404, which is the harness's whole point.
        run: |
          if [ -z "$HARNESS_URL" ]; then exit 0; fi
          status="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$HARNESS_URL/bilging?seed=deploy-check")"
          if [ "$status" = 200 ]; then echo "deep links open ($status)"; else echo "::error::$HARNESS_URL/bilging returned HTTP $status; the SPA rewrite is not in effect. Check that the project's Root Directory is packages/harness so its vercel.json is read. See docs/DEPLOY.md, step 2b."; exit 1; fi
      - name: Server accepts requests from the harness origin
        run: |
          if [ -z "$SERVER_URL" ] || [ -z "$HARNESS_URL" ]; then exit 0; fi
          .github/scripts/check-origin.sh "$SERVER_URL" "$HARNESS_URL" "the harness"
