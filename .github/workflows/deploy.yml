name: Deploy

# Continuous deployment from main (ADR 0014). Runs after CI succeeds on main, or by hand.
# Order is deliberate: the server goes first and must serve the new commit on /health before the
# two front ends that talk to it are built and deployed against it. The game (client) and the
# puzzle studio (ADR 0019, ADR 0042) are separate Vercel projects and deploy in parallel after the
# server. The puzzle guides (ADR 0038) are a third, a static site that needs no server and waits
# for none. The studio's service (ADR 0043) goes to Railway on its own. Each side is skipped when
# nothing under it changed, unless forced from the manual trigger. The three Vercel jobs share
# .github/scripts/vercel-deploy.sh. Setup and secrets: docs/DEPLOY.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      server:
        description: Deploy the server even if nothing under it changed
        type: boolean
        default: false
      client:
        description: Deploy the game client even if nothing under it changed
        type: boolean
        default: false
      studio:
        description: Deploy the puzzle studio site even if nothing under it changed
        type: boolean
        default: false
      studio_server:
        description: Deploy the studio's service even if nothing under it changed
        type: boolean
        default: false
      docs:
        description: Deploy the puzzle guides even if nothing under them changed
        type: boolean
        default: false

# Deploys queue behind each other and never cancel one in flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  plan:
    name: What changed
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.changed.outputs.server }}
      client: ${{ steps.changed.outputs.client }}
      studio: ${{ steps.changed.outputs.studio }}
      docs: ${{ steps.changed.outputs.docs }}
      studio_server: ${{ steps.changed.outputs.studio_server }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 2
      - id: changed
        env:
          FORCE_SERVER: ${{ inputs.server == true }}
          FORCE_CLIENT: ${{ inputs.client == true }}
          FORCE_STUDIO: ${{ inputs.studio == true }}
          FORCE_STUDIO_SERVER: ${{ inputs.studio_server == true }}
          FORCE_DOCS: ${{ inputs.docs == true }}
          STUDIO_SERVICE: ${{ vars.RAILWAY_STUDIO_SERVICE }}
        run: |
          # side <name> <forced> <paths...>: true when forced or when the commit touched any path.
          side() {
            local name="$1" forced="$2"; shift 2
            if [ "$forced" = true ] || ! git diff --quiet HEAD^ HEAD -- "$@"; then v=true; else v=false; fi
            echo "$name=$v" | tee -a "$GITHUB_OUTPUT"
          }
          # Anything that changes every build: the workspace and the pipeline itself.
          base=(pnpm-lock.yaml pnpm-workspace.yaml package.json .github/workflows/deploy.yml .github/scripts .github/actions)
          shared=(packages/engine packages/protocol packages/content "${base[@]}")
          side server "$FORCE_SERVER" packages/server railpack.json "${shared[@]}"
          side client "$FORCE_CLIENT" packages/client packages/boards vercel.json "${shared[@]}"
          side studio "$FORCE_STUDIO" packages/studio packages/boards "${shared[@]}"
          # The docs read content, the engine's puzzle list and the puzzle domain guide (ADR 0091); they
          # share no code with the boards.
          side docs "$FORCE_DOCS" packages/docs packages/engine packages/content docs/puzzles "${base[@]}"
          # The studio's service (ADR 0043) shares only the protocol with the rest. Until it has a
          # Railway service (docs/DEPLOY.md, step 1b) there is nowhere to deploy it, and that is
          # no warning: the studio works without it.
          if [ -n "$STUDIO_SERVICE" ]; then
            side studio_server "$FORCE_STUDIO_SERVER" packages/studio-server packages/protocol railpack.studio.json "${base[@]}"
          else
            echo "studio_server=false" | tee -a "$GITHUB_OUTPUT"
          fi

  studio-server:
    name: Studio service to Railway
    needs: plan
    if: needs.plan.outputs.studio_server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_STUDIO_SERVICE }}
      SERVICE_URL: ${{ vars.PRODUCTION_STUDIO_SERVICE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @railway/cli
      - name: Check configuration
        run: |
          [ -n "$RAILWAY_TOKEN" ] || { echo "::error::Secret RAILWAY_TOKEN is not set. See docs/DEPLOY.md, step 1."; exit 1; }
          [ -n "$SERVICE_URL" ] || echo "::warning::Variable PRODUCTION_STUDIO_SERVICE_URL is not set, so this job cannot wait for the studio's service to come up. See docs/DEPLOY.md, step 1b."
      - name: Record the commit on the service
        run: railway variables --service "$RAILWAY_SERVICE" --set "GIT_COMMIT_SHA=$SHA" --skip-deploys
      - name: Upload and build
        # The service's RAILPACK_CONFIG_FILE variable points the build at railpack.studio.json.
        run: |
          railway up --service "$RAILWAY_SERVICE" --ci
          echo "Studio service uploaded to Railway service $RAILWAY_SERVICE (commit $SHA)" >> "$GITHUB_STEP_SUMMARY"
      - name: Wait until the service serves this commit
        run: |
          if [ -z "$SERVICE_URL" ]; then exit 0; fi
          .github/scripts/wait-for-commit.sh "$SERVICE_URL/health" "$SHA" 600

  server:
    name: Server to Railway
    needs: plan
    if: needs.plan.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      SERVER_URL: ${{ vars.PRODUCTION_SERVER_URL }}
      CLIENT_URL: ${{ vars.PRODUCTION_CLIENT_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @railway/cli
      - name: Check configuration
        run: |
          ok=true
          [ -n "$RAILWAY_TOKEN" ] || { echo "::error::Secret RAILWAY_TOKEN is not set. See docs/DEPLOY.md, step 1."; ok=false; }
          [ -n "$RAILWAY_SERVICE" ] || { echo "::error::Variable RAILWAY_SERVICE is not set. See docs/DEPLOY.md, step 1."; ok=false; }
          [ -n "$SERVER_URL" ] || echo "::warning::Variable PRODUCTION_SERVER_URL is not set, so this job cannot wait for the server to come up before the client deploys."
          $ok
      - name: Record the commit on the service
        run: railway variables --service "$RAILWAY_SERVICE" --set "GIT_COMMIT_SHA=$SHA" --skip-deploys
      - name: Upload and build
        run: |
          railway up --service "$RAILWAY_SERVICE" --ci
          echo "Server uploaded to Railway service $RAILWAY_SERVICE (commit $SHA)" >> "$GITHUB_STEP_SUMMARY"
      - name: Wait until the server serves this commit
        run: |
          if [ -z "$SERVER_URL" ]; then exit 0; fi
          .github/scripts/wait-for-commit.sh "$SERVER_URL/health" "$SHA" 900
      - name: Server accepts requests from the client origin
        # The browser preflights every API call. If CLIENT_ORIGINS on the Railway service does not
        # list the client's exact origin, the game is unusable even though both deploys are green.
        run: |
          if [ -z "$SERVER_URL" ] || [ -z "$CLIENT_URL" ]; then exit 0; fi
          .github/scripts/check-origin.sh "$SERVER_URL" "$CLIENT_URL" "the game client"

  client:
    name: Client to Vercel
    needs: [plan, server]
    # always() so a skipped server deploy does not skip the client; a failed one does.
    if: always() && needs.plan.outputs.client == 'true' && (needs.server.result == 'success' || needs.server.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      APP: client
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      URL: ${{ vars.PRODUCTION_CLIENT_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: ./.github/actions/vercel-setup
      - name: Build, deploy and check
        run: .github/scripts/vercel-deploy.sh

  studio:
    name: Studio to Vercel
    needs: [plan, server]
    if: always() && needs.plan.outputs.studio == 'true' && (needs.server.result == 'success' || needs.server.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      APP: studio
      # VERCEL_STUDIO_TOKEN when VERCEL_TOKEN is scoped to the game's project alone (step 3).
      VERCEL_TOKEN: ${{ secrets.VERCEL_STUDIO_TOKEN || secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      # The studio's own Vercel project, rooted in packages/studio (docs/DEPLOY.md, step 2b).
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_STUDIO_PROJECT_ID }}
      URL: ${{ vars.PRODUCTION_STUDIO_URL }}
      # Every puzzle page is a deep link, and a shared tester link would 404 without the rewrite.
      DEEP_LINK: /cooling?seed=deploy-check
      SERVER_URL: ${{ vars.PRODUCTION_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: ./.github/actions/vercel-setup
      - name: Build, deploy and check
        run: .github/scripts/vercel-deploy.sh
      - name: Server accepts requests from the studio origin
        run: |
          if [ -z "$SERVER_URL" ] || [ -z "$URL" ]; then exit 0; fi
          .github/scripts/check-origin.sh "$SERVER_URL" "$URL" "the studio"

  docs:
    name: Guides to Vercel
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      APP: docs
      # VERCEL_DOCS_TOKEN when VERCEL_TOKEN is scoped to the game's project alone (step 3).
      VERCEL_TOKEN: ${{ secrets.VERCEL_DOCS_TOKEN || secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      # The guides' own Vercel project, rooted in packages/docs (docs/DEPLOY.md, step 2c).
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_DOCS_PROJECT_ID }}
      URL: ${{ vars.PRODUCTION_DOCS_URL }}
      DEEP_LINK: /cooling
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: ./.github/actions/vercel-setup
      - name: Build, deploy and check
        run: .github/scripts/vercel-deploy.sh
