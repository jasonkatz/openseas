name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit, integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openseas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Engine purity lint
        run: pnpm --filter @openseas/engine lint
      - run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/openseas_test
      - name: Migrations are up to date with the schema
        run: |
          pnpm --filter @openseas/server db:generate
          git diff --exit-code -- packages/server/drizzle || (echo "::error::schema changed without a generated migration; run pnpm db:generate" && exit 1)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/openseas_test

  smoke:
    name: Client build and Playwright smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openseas/client exec playwright install --with-deps chromium
      - run: pnpm --filter @openseas/client test:smoke
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/client/playwright-report
          retention-days: 7
